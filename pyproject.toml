[project]
name = "my-final-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "asyncpg~=0.31.0",
    "fastapi~=0.135.1",
    "passlib ~= 1.7.4",
    "pydantic[email]~=2.12.5",
    "pydantic-settings~=2.13.1",
    "pytest~=9.0.2",
    "python-jose ~= 3.5.0",
    "sqlalchemy~=2.0.48",
    "uvicorn~=0.41.0",
    "bcrypt~=5.0.0",
]


[project.optional-dependencies]
dev = [
    "pytest~=9.0.2",
    "pytest-asyncio~=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
